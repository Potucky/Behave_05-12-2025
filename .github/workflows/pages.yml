# Push to main only. Runs the tests, then deploys the Allure HTML report
# and docs/pages/index.html with actions/upload-pages-artifact and
# actions/deploy-pages. The repository Pages source must be GitHub Actions.
name: Publish test report

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Java for the Allure report
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Ensure Google Chrome
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install -y /tmp/chrome.deb
          fi
          google-chrome --version

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Check checkout arithmetic
        run: python -m unittest discover -s framework -p "test_*.py"

      - name: Run Behave
        env:
          HEADLESS: "true"
          EXPLICIT_WAIT: "20"
        run: |
          behave \
            --no-color \
            -f pretty -o - \
            -f allure_behave.formatter:AllureFormatter -o reports/allure-results

      - name: Install Allure command line
        if: always()
        run: |
          curl -sSL -o /tmp/allure.tgz \
            https://github.com/allure-framework/allure2/releases/download/2.46.2/allure-2.46.2.tgz
          tar -xzf /tmp/allure.tgz -C /tmp
          echo "/tmp/allure-2.46.2/bin" >> "$GITHUB_PATH"

      - name: Generate the Allure report
        if: always()
        run: |
          if [ -d reports/allure-results ] && [ -n "$(ls -A reports/allure-results 2>/dev/null)" ]; then
            allure generate reports/allure-results --clean -o reports/allure-report
          else
            echo "No Allure results were produced."
            exit 1
          fi

      - name: Assemble the Pages site
        id: site
        if: always()
        run: |
          if [ ! -f reports/allure-report/index.html ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Allure HTML report is missing; not uploading a Pages artifact."
            exit 0
          fi
          rm -rf site
          mkdir -p site/allure-report
          cp docs/pages/index.html site/index.html
          cp -a reports/allure-report/. site/allure-report/
          touch site/.nojekyll
          test -f site/index.html
          test -f site/allure-report/index.html
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        if: steps.site.outputs.ready == 'true'
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: steps.site.outputs.ready == 'true' && steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.site.outputs.ready == 'true' && steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v5
